name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No provider calls, no credentials — every check is local and hermetic.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Clone pinned gbrain engine
        run: |
          git clone --quiet https://github.com/garrytan/gbrain.git vendor/gbrain
          git -C vendor/gbrain checkout --quiet a25209bbb2bacf1b88e06fd5282b27f1bf4a3e7a

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned engine dependencies
        run: bun install --cwd vendor/gbrain --frozen-lockfile --ignore-scripts

      - name: Install documentation website dependencies
        run: bun install --cwd website --frozen-lockfile

      # Pass 6 (F-T4): this used to set EBRAIN_HOME: ${{ github.workspace }}, which short-circuits the
      # resolver — the exact thing the fix exists to make unnecessary. CI then "passed" while a fresh
      # install failed, and that green was cited as portability evidence. Run WITHOUT EBRAIN_HOME so
      # the suite exercises real resolution, and a second time under the C locale with no EBRAIN_HOME
      # so CI is the portability proof (F-S1 + the tmux/locale defect) rather than a claim about one.
      - name: CLI test suite (real resolution, no EBRAIN_HOME)
        run: bun test ./cli/

      - name: CLI test suite (C locale, the container/minimal-server default)
        run: bun test ./cli/
        env:
          LC_ALL: C
          LANG: C

      - name: TUI test suite
        run: bun test ./tui/test/

      - name: Documentation website check
        run: bun run --cwd website check

      - name: Documentation website build
        run: bun run website:build

      - name: Shell syntax check
        # Every shell entrypoint, not a hand-listed five. The list drifted behind the tree, so a
        # launcher or a harness core file could ship unparseable and only fail on a user's machine.
        run: |
          fail=0
          for f in cli/ebrain scripts/* harness/core/*.sh; do
            case "$f" in *.md|*.ts|*/systemd) continue ;; esac
            [ -f "$f" ] || continue
            head -n1 "$f" | grep -qE '^#!.*(sh|bash)' || case "$f" in *.sh) ;; *) continue ;; esac
            if ! bash -n "$f" 2>/tmp/shellerr; then
              echo "::error file=$f::$(cat /tmp/shellerr)"; fail=1
            fi
          done
          exit $fail

      - name: No GNU-only spellings outside the portability shims
        # These four fail differently on a BSD userland (macOS) and every failure is swallowed by a
        # nearby `|| true`, so the symptom is a check that silently reports the wrong thing.
        # harness/core/ebrain-home.sh holds the shims and is the only place allowed to name them.
        run: |
          fail=0
          check() {
            if rg -n "$1" scripts/ harness/ --glob '!harness/core/ebrain-home.sh' 2>/dev/null; then
              echo "::error::$2"; fail=1
            fi
          }
          check '\$\(mktemp\)'            "bare mktemp needs a template on BSD — use ebrain_mktemp"
          check 'stat -c'                 "stat -c is GNU-only — use ebrain_file_mode"
          check '(^|[|;&(] *)timeout [0-9]' "timeout is GNU coreutils — use ebrain_timeout"
          check 'declare -A|local -A'     "associative arrays need bash 4; macOS ships bash 3.2"
          exit $fail

      - name: Zero-hex rule (TUI colors come from the design system, not literals)
        run: |
          if rg -n '#[0-9A-Fa-f]{3,8}' tui/src --glob '!theme.ts'; then echo "::error::hardcoded hex in tui/src"; exit 1; fi
          if rg -n '#[0-9A-Fa-f]{3,8}' tui/test --glob '!theme.test.ts'; then echo "::error::hardcoded hex in tui/test"; exit 1; fi

      - name: Secret scan
        run: |
          if rg -nI -e 'sk-[A-Za-z0-9]{20,}' -e 'gbrain_[A-Za-z0-9._~+/-]{24,}' -e 'AKIA[0-9A-Z]{16}' \
                --glob '!vendor/**' --glob '!**/*.test.ts' .; then
            echo "::error::possible secret detected"; exit 1
          fi

  # The `test` job runs inside a git checkout at a space-free path — the one environment where the
  # resolver has the most help. This job reproduces the acceptance environment from
  # docs/SPEC-PORTABILITY-HARDENING.md instead: an arbitrary checkout path that CONTAINS A SPACE,
  # with NO .git (a tarball / Docker COPY install — the surface a user actually installs from), a
  # sandboxed $HOME with no pre-existing eBrain state, the C locale, and EBRAIN_HOME absent from the
  # ancestry. It exists so the class of defect that took six audit passes to close cannot regress
  # silently: a guard that only enforces inside git, a path that breaks on a space, a doctor that
  # fails on a fresh install.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Clone pinned gbrain engine
        run: |
          git clone --quiet https://github.com/garrytan/gbrain.git vendor/gbrain
          git -C vendor/gbrain checkout --quiet a25209bbb2bacf1b88e06fd5282b27f1bf4a3e7a

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd vendor/gbrain --frozen-lockfile --ignore-scripts

      # Dimension 1 — a checkout path that CONTAINS A SPACE (F-T6), kept git-backed so the git-aware
      # release-readiness tests (tracked mode bits, `git clone HEAD`, gitignore hygiene) still apply.
      - name: A git-backed checkout at a path with a space (F-T6)
        run: |
          dest="$RUNNER_TEMP/ebrain space dir"     # the space is deliberate
          git worktree add --detach "$dest" HEAD
          rsync -a node_modules "$dest/"
          mkdir -p "$dest/vendor"
          rsync -a vendor/gbrain "$dest/vendor/"
          echo "SPACED=$dest" >> "$GITHUB_ENV"

      - name: Full suite from the spaced checkout (sandbox HOME, C locale, no EBRAIN_HOME)
        env:
          LC_ALL: C
          LANG: C
        run: |
          sandbox="$RUNNER_TEMP/sandbox home a"
          mkdir -p "$sandbox"
          cd "$SPACED"
          env -u EBRAIN_HOME HOME="$sandbox" bun test ./cli/ ./tui/test/

      # Dimension 2 — the NON-GIT surface a user actually installs from (git archive / Docker COPY).
      # Only the checks that must hold without git run here; the git-aware release-readiness tests
      # (tracked mode bits, `git clone HEAD`, gitignore hygiene) are out of scope for a tarball.
      - name: A non-git tarball checkout (git archive surface)
        run: |
          dest="$RUNNER_TEMP/ebrain tarball dir"
          mkdir -p "$dest"
          git archive HEAD | tar -x -C "$dest"
          test ! -e "$dest/.git" || { echo "::error::checkout is still a git repo — the non-git case is not being exercised"; exit 1; }
          rsync -a node_modules "$dest/"
          mkdir -p "$dest/vendor"
          rsync -a vendor/gbrain "$dest/vendor/"
          echo "TARBALL=$dest" >> "$GITHUB_ENV"

      - name: The hardcoded-home guard must be non-vacuous outside git (plant an offender)
        run: |
          cd "$TARBALL"
          # Compose the forbidden spelling at runtime — never let it live in a tracked file, or this
          # workflow would trip the very guard it exists to test (the guard scans .github too).
          name='eBrain'
          printf 'X="$HOME/%s"\n' "$name" > scripts/__ci_planted_offender.sh
          if env -u EBRAIN_HOME bun test ./cli/ebrain-home.test.ts >/dev/null 2>&1; then
            rm -f scripts/__ci_planted_offender.sh
            echo "::error::the guard passed with a planted offender present — it is vacuous outside git"; exit 1
          fi
          rm -f scripts/__ci_planted_offender.sh
          echo "guard correctly failed on the planted offender"

      - name: ebrain doctor exits 0 on a fresh non-git install
        env:
          LC_ALL: C
          LANG: C
        run: |
          sandbox="$RUNNER_TEMP/sandbox home b"
          mkdir -p "$sandbox"
          cd "$TARBALL"
          env -u EBRAIN_HOME HOME="$sandbox" bash ./cli/ebrain doctor
