# ~/eBrain/config/advisor-rules.yaml
# advisor v0 (SPRINT-TUI 6.1.7) — fuente de verdad DECLARATIVA para `ebrain advise "<tarea>"`.
# Determinista, rule-based: capacidad = keywords (mismo estilo que routing.yaml `classify`, pero
# NO duplica sus valores de precio/modelo — cli/advise.ts lee routing.yaml aparte para las cadenas
# ganador/fallback/floor). Dos capas de señales ADEMÁS de la capacidad:
#   - audit_signals / multimodal_signals: OVERRIDEAN el carril normal (auditoría→Claude, video→gemini).
#   - oneshot_signals: empuja una tarea de "sesión interactiva" (default por capacidad) a "one-shot
#     barato" (`ebrain route --cap X`).
#
# HARD LOCK (heredado F4/D5): frontier:true en la salida de `ebrain advise` es SIEMPRE una
# RECOMENDACIÓN, nunca un default silencioso. El único lane con frontier:true es `claude_audit`,
# `kind: confirm` — jamás se auto-lanza (eso lo decide el launch flow humano en F6.6.1).
#
# capability_lane está tomado 1:1 de docs/tier0-playbook.md §"Filtro de decisión" (no inventa un
# carril nuevo): Codex = código serio/agentic, OpenCode = scripts/scaffolding/contexto largo,
# Cursor = edición visual/frontend, gemini = multimodal/batch gratis, Claude Code = auditoría (confirm).

capabilities:
  coding:
    keywords: [code, function, bug, refactor, script, typescript, python, test, api, regex, fix]
  agentic:
    keywords: [agent, tool-call, multi-step, orchestrate, workflow, loop, autonomous, scrape, crawl]
  web_design:
    keywords: [component, ui, tailwind, css, design, layout, frontend, react, next.js]
  long_context:
    keywords: [summarize, digest, "whole repo", long, transcript, entire, ingest, batch]
  terminal:
    keywords: [bash, shell, terminal, command, cli, pipeline, ffmpeg]
  general:
    keywords: []   # fallback: gana sin match o en empate (mismo criterio que route.ts classify())

# Empuja una tarea de "sesión interactiva" (default por capacidad) a "one-shot barato" (route --cap).
oneshot_signals:
  keywords: [batch, one-shot, oneshot, quick, digest, summarize, regex, scrape, doc, documentation, one-off, cron, scheduled]

# OVERRIDE duro: auditoría/arquitectura SIEMPRE va a Claude Code, confirm-only (gana sobre capacidad y oneshot).
audit_signals:
  keywords: [architecture, audit, "security review", "threat model", "code review", "design review", arquitectura, auditoría]

# OVERRIDE duro: multimodal/video/imagen SIEMPRE va a gemini (nativo multimodal, free tier).
multimodal_signals:
  keywords: [video, image, screenshot, multimodal, transcribe, audio, ocr, diagram, watch, frame]

# Carriles concretos.
#   model_source: routing        → modelo = capabilities[cap].models[0] de routing.yaml (ganador)
#   model_source: routing-floor  → modelo = capabilities[cap].models[último] de routing.yaml (floor/free)
#   model_source: static         → modelo fijo (agente con su propia suscripción/modelo nativo,
#                                    no pasa por el stack OpenRouter — no hay cadena que resolver)
lanes:
  one_shot_route:
    kind: route
    agent: route
    model_source: routing
    frontier: false
    note: "one-shot barato vía `ebrain route --cap <capacidad>` — stack OpenRouter capado $10/mo"
  interactive_codex:
    kind: session
    agent: codex
    model_source: static
    model: "codex-cli (modelo nativo OpenAI, créditos $2500 — Tier 0 cerebro/constructor)"
    frontier: false
    note: "sesión interactiva de construcción — Codex es el driver primario diario"
  interactive_opencode:
    kind: session
    agent: opencode
    model_source: routing-floor
    frontier: false
    note: "sesión interactiva barata — OpenCode + stack chino (floor), caballo de batalla CLI/scripts/contexto largo"
  interactive_cursor:
    kind: session
    agent: cursor
    model_source: static
    model: "cursor-agent (modelos Anthropic, créditos $50)"
    frontier: false
    note: "edición visual/frontend — rol declarado para web_design (tier0-playbook)"
  claude_audit:
    kind: confirm
    agent: claude
    model_source: static
    model: "claude-opus (Fable 5 para gates de alto riesgo) — FRONTIER"
    frontier: true
    note: "auditoría/arquitectura — SOLO RECOMENDACIÓN, exige confirmación explícita antes de lanzar (candado frontier F4/D5, jamás auto-escala)"
  gemini_multimodal:
    kind: session
    agent: gemini
    model_source: static
    model: "gemini-cli (free tier, multimodal nativo)"
    frontier: false
    note: "multimodal/ingesta masiva gratis — gemini free tier"

# capacidad → {oneshot: <lane>, session: <lane>} (default cuando ningún override aplica).
capability_lane:
  coding:       { oneshot: one_shot_route, session: interactive_codex }
  agentic:      { oneshot: one_shot_route, session: interactive_codex }
  web_design:   { oneshot: one_shot_route, session: interactive_cursor }
  long_context: { oneshot: one_shot_route, session: interactive_opencode }
  terminal:     { oneshot: one_shot_route, session: interactive_opencode }
  general:      { oneshot: one_shot_route, session: interactive_codex }
