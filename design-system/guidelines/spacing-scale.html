<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-void);font-family:var(--font-mono);font-size:15px;line-height:1.2;color:var(--text-1)}.wrap{padding:14px 16px}.pre{white-space:pre;margin:0}.dim{color:var(--text-3)}.lbl{color:var(--text-3);margin:0 0 6px}</style></head>
<body><div class="wrap"><div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
     <span class="dim" style="width:6ch">1 celda</span>
     <div style="width:calc(1ch);height:18px;background:var(--accent-dim)"></div>
     <span class="dim">1ch</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
     <span class="dim" style="width:6ch">2 celdas</span>
     <div style="width:calc(2ch);height:18px;background:var(--accent-dim)"></div>
     <span class="dim">2ch</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
     <span class="dim" style="width:6ch">4 celdas</span>
     <div style="width:calc(4ch);height:18px;background:var(--accent-dim)"></div>
     <span class="dim">4ch</span></div>
   <p class="lbl" style="margin-top:10px">vertical = filas completas (1, 2)</p></div></body></html>
