<!-- @dsCard group="Brand" viewport="700x260" name="Inventario de glifos" subtitle="box-drawing / bloques / braille + fallback ASCII" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-void);font-family:var(--font-mono);font-size:15px;line-height:1.2;color:var(--text-1)}.wrap{padding:14px 16px}.pre{white-space:pre;margin:0}.dim{color:var(--text-3)}.lbl{color:var(--text-3);margin:0 0 6px}</style></head>
<body><div class="wrap"><table style="border-collapse:collapse;width:100%">
   <tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">panel</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">╭─╮│╰╯</td>
     <td class="pre dim">+ - + | + +</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">dialogo</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">┌─┐│└┘</td>
     <td class="pre dim">+ - + | + +</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">prompt</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">┃</td>
     <td class="pre dim">|</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">gauge</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">█▓░</td>
     <td class="pre dim"># = .</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">bloques</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">█▀▄▓▒░</td>
     <td class="pre dim"># " _ = : .</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">scrollbar</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">█ ░</td>
     <td class="pre dim"># |</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">spinner</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">⠋⠙⠹⠸⠼</td>
     <td class="pre dim">| / - \\</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">sep</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">· │ ─</td>
     <td class="pre dim">. | -</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">dot</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">●</td>
     <td class="pre dim">*</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">caret</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">▌</td>
     <td class="pre dim">_</td></tr><tr>
     <td class="dim" style="padding:2px 12px 2px 0;width:11ch">arrows</td>
     <td class="pre" style="color:var(--text-1);padding:2px 16px 2px 0">→ ↑ ↓ ▸ ▾</td>
     <td class="pre dim">> ^ v > v</td></tr>
   </table></div></body></html>
