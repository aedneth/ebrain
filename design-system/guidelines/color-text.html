<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-void);font-family:var(--font-mono);font-size:15px;line-height:1.2;color:var(--text-1)}.wrap{padding:14px 16px}.pre{white-space:pre;margin:0}.dim{color:var(--text-3)}.lbl{color:var(--text-3);margin:0 0 6px}</style></head>
<body><div class="wrap"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <div style="width:44px;height:22px;background:var(--text-1);flex:none"></div>
    <span style="color:var(--text-1);font-weight:700;width:9ch">#E6EAF2</span>
    <span class="dim" style="width:16ch">primario</span>
    <span class="dim">xterm 254</span>
  </div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <div style="width:44px;height:22px;background:var(--text-2);flex:none"></div>
    <span style="color:var(--text-2);font-weight:700;width:9ch">#8B94A7</span>
    <span class="dim" style="width:16ch">secundario</span>
    <span class="dim">xterm 246</span>
  </div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <div style="width:44px;height:22px;background:var(--text-3);flex:none"></div>
    <span style="color:var(--text-3);font-weight:700;width:9ch">#565F73</span>
    <span class="dim" style="width:16ch">muted / dim</span>
    <span class="dim">xterm 60</span>
  </div></div></body></html>
