<!-- @dsCard group="Colors" viewport="700x170" name="Semanticos" subtitle="ok / warn / error / info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-void);font-family:var(--font-mono);font-size:15px;line-height:1.2;color:var(--text-1)}.wrap{padding:14px 16px}.pre{white-space:pre;margin:0}.dim{color:var(--text-3)}.lbl{color:var(--text-3);margin:0 0 6px}</style></head>
<body><div class="wrap"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <div style="width:44px;height:22px;background:var(--ok);flex:none"></div>
    <span style="color:var(--ok);font-weight:700;width:9ch">#4ADE80</span>
    <span class="dim" style="width:16ch">ok</span>
    <span class="dim">xterm 78</span>
  </div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <div style="width:44px;height:22px;background:var(--warn);flex:none"></div>
    <span style="color:var(--warn);font-weight:700;width:9ch">#FBBF24</span>
    <span class="dim" style="width:16ch">warn</span>
    <span class="dim">xterm 214</span>
  </div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <div style="width:44px;height:22px;background:var(--error);flex:none"></div>
    <span style="color:var(--error);font-weight:700;width:9ch">#F87171</span>
    <span class="dim" style="width:16ch">error</span>
    <span class="dim">xterm 210</span>
  </div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <div style="width:44px;height:22px;background:var(--info);flex:none"></div>
    <span style="color:var(--info);font-weight:700;width:9ch">#60A5FA</span>
    <span class="dim" style="width:16ch">info</span>
    <span class="dim">xterm 75</span>
  </div></div></body></html>
