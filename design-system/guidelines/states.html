<!-- @dsCard group="Brand" viewport="700x200" name="Estados" subtitle="combinaciones color+peso: focus/blur/selected/disabled" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg-void);font-family:var(--font-mono);font-size:15px;line-height:1.2;color:var(--text-1)}.wrap{padding:14px 16px}.pre{white-space:pre;margin:0}.dim{color:var(--text-3)}.lbl{color:var(--text-3);margin:0 0 6px}</style></head>
<body><div class="wrap"><div class="pre" style="margin-bottom:8px"><span class="dim" style="display:inline-block;width:11ch">focus</span> <span style="color:var(--accent);font-weight:700">─ borde teal + titulo bold</span></div>
   <div class="pre" style="margin-bottom:8px"><span class="dim" style="display:inline-block;width:11ch">blur</span> <span style="color:var(--border-1)">─ borde dim</span> <span style="color:var(--text-2)">+ titulo secundario</span></div>
   <div class="pre" style="margin-bottom:8px"><span class="dim" style="display:inline-block;width:11ch">selected</span> <span style="background:var(--surface-2);color:var(--text-1)"> fondo elevado █ </span></div>
   <div class="pre"><span class="dim" style="display:inline-block;width:11ch">disabled</span> <span style="color:var(--text-3)">dim, nunca oculto</span></div></div></body></html>
